<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APL Art — tiny programs, infinite patterns</title>
    <meta
      name="description"
      content="Create patterns, fractals and generative art with Dyalog APL. Choose a piece, change the code and see what happens."
    />
    <!--
      The site's own card, and the only one a crawler ever sees.

      Routes live in the URL fragment, which is never sent to a server, so every
      address returns this file — and social crawlers generally do not run the
      JavaScript that would then rewrite these for the route being viewed. So
      what is written here describes APL Art, which is honestly what the address
      a crawler fetched resolves to. `src/app/metadata.ts` keeps these in step
      with the route for the browser tab and for anything reading the live
      document; making them true for crawlers as well would need real paths and
      server-rendered routes rather than different markup.
    -->
    <meta property="og:title" content="APL Art — tiny programs, infinite patterns" />
    <meta
      property="og:description"
      content="Create patterns, fractals and generative art with Dyalog APL. Choose a piece, change the code and see what happens."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:title" content="APL Art — tiny programs, infinite patterns" />
    <meta
      name="twitter:description"
      content="Create patterns, fractals and generative art with Dyalog APL. Choose a piece, change the code and see what happens."
    />

    <meta name="colour-scheme" content="light dark" />
    <meta name="theme-color" content="#ff6a13" />

    <!--
      The only network destination the application needs at runtime is the APL
      execution endpoint. Everything else is served from our own origin.
      connect-src is widened at build time if VITE_APL_EXEC_ENDPOINT points
      somewhere other than TryAPL.

      frame-ancestors is deliberately absent: browsers ignore it in a meta
      element and log a console error for it. Blocking framing needs a real
      response header, which GitHub Pages cannot set.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://tryapl.org; base-uri 'self'; form-action 'none'; object-src 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>APL Art needs JavaScript to run APL code and draw artwork.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
